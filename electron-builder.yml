# ─────────────────────────────────────────────────────────────────────────────
# ElitPOS — electron-builder Configuration
# Produces a Windows NSIS installer (.exe) and optional portable .exe
# ─────────────────────────────────────────────────────────────────────────────

appId: "ke.co.elitjohnsdigital.elitpos"
productName: "ElitPOS"
copyright: "Copyright © 2024-2025 Elitjohns Digital Agency"

# ── Source & output ───────────────────────────────────────────────────────────
directories:
  output: "dist-electron"
  buildResources: "electron/build-resources"

# ── Files to include in the package ──────────────────────────────────────────
# We include:
#   1. The Electron main process files (electron/)
#   2. The compiled Next.js output (.next/)
#   3. The public/ assets
#   4. The compiled server.js (built by `npm run build:server`)
#   5. The package.json (for `require` resolution)
# We EXCLUDE: source TypeScript, test files, large dev-only dirs
files:
  - "electron/**/*"
  - ".next/**/*"
  - "public/**/*"
  - "server.js"
  - "package.json"
  - "node_modules/**/*"
  - "!node_modules/.cache/**/*"
  - "!node_modules/**/*.map"
  - "!**/*.ts"
  - "!**/*.tsx"
  - "!src/**/*"
  - "!drizzle/**/*"
  - "!e2e/**/*"
  - "!stress-tests/**/*"
  - "!docs/**/*"
  - "!*.md"
  - "!.env*"
  - "!.git/**/*"

# Extra files placed in resources/ (accessible via process.resourcesPath)
extraResources:
  - from: "server.js"
    to: "server.js"
  - from: ".next"
    to: ".next"
  - from: "public"
    to: "public"

# ── Electron entry point ──────────────────────────────────────────────────────
main: "electron/main.js"

# ── App metadata ──────────────────────────────────────────────────────────────
asar: true

# ── Windows ───────────────────────────────────────────────────────────────────
win:
  target:
    - target: "nsis"
      arch:
        - x64
        - ia32
    - target: "portable"
      arch:
        - x64
  icon: "public/icons/mainlogo.png"
  # Code signing (configure these env vars in CI or comment out for unsigned builds):
  # certificateFile: "${env.WIN_CERT_FILE}"
  # certificatePassword: "${env.WIN_CERT_PASSWORD}"
  # signingHashAlgorithms: ["sha256"]
  requestedExecutionLevel: "asInvoker"
  # Include VC++ redistributables so native modules work
  verifyUpdateCodeSignature: false

# ── NSIS installer options ────────────────────────────────────────────────────
nsis:
  oneClick: false                   # Show installer wizard
  allowToChangeInstallationDirectory: true
  allowElevation: true
  installerIcon: "public/icons/mainlogo.png"
  uninstallerIcon: "public/icons/mainlogo.png"
  installerHeaderIcon: "public/icons/mainlogo.png"
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: "ElitPOS"
  license: "LICENSE"
  # Custom installer pages
  installerLanguages:
    - "English"
  # Install for all users by default
  perMachine: false
  deleteAppDataOnUninstall: false
  displayLanguageSelector: false
  multiLanguageInstaller: false

# ── Portable build ────────────────────────────────────────────────────────────
portable:
  # Portable build stores data next to the exe
  artifactName: "ElitPOS-${version}-portable-${arch}.exe"

# ── macOS (for reference — requires macOS to build) ───────────────────────────
mac:
  target:
    - target: "dmg"
      arch: ["x64", "arm64"]
    - target: "zip"
      arch: ["x64", "arm64"]
  icon: "public/icons/mainlogo.png"
  category: "public.app-category.business"
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: "electron/build-resources/entitlements.mac.plist"
  entitlementsInherit: "electron/build-resources/entitlements.mac.plist"

dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

# ── Linux (for reference) ─────────────────────────────────────────────────────
linux:
  target:
    - target: "AppImage"
      arch: ["x64"]
    - target: "deb"
      arch: ["x64"]
  icon: "public/icons/mainlogo.png"
  category: "Office"
  description: "AI-Powered Point of Sale & Business Management System"
  maintainer: "Elitjohns Digital Agency <info@elitjohnsdigital.co.ke>"

# ── Build hooks ───────────────────────────────────────────────────────────────
# afterSign: "electron/build-resources/notarize.js"  # macOS notarization

# ── Auto-updater ──────────────────────────────────────────────────────────────
publish:
  provider: "github"
  owner: "elitjohns"
  repo: "elitpos"
  private: true
  # Alternatively use a generic HTTP server:
  # provider: "generic"
  # url: "https://updates.elitjohnsdigital.co.ke/releases"
