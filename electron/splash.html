<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ElitPOS — Starting...</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 480px;
      height: 320px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #071209;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #ffffff;
      overflow: hidden;
      border-radius: 12px;
      user-select: none;
      -webkit-app-region: drag;
    }

    .logo-wrapper {
      width: 80px;
      height: 80px;
      margin-bottom: 24px;
      position: relative;
    }

    .logo-glow {
      position: absolute;
      inset: -12px;
      background: radial-gradient(circle, rgba(0, 255, 136, 0.2) 0%, transparent 70%);
      border-radius: 50%;
      animation: pulse 2s ease-in-out infinite;
    }

    .logo-img {
      width: 80px;
      height: 80px;
      object-fit: contain;
      position: relative;
      z-index: 1;
    }

    .app-name {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: #00FF88;
      margin-bottom: 8px;
    }

    .tagline {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.5);
      margin-bottom: 40px;
      letter-spacing: 0.02em;
    }

    .progress-track {
      width: 240px;
      height: 3px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 99px;
      overflow: hidden;
      margin-bottom: 16px;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #00FF88, #00cc6a);
      border-radius: 99px;
      width: 0%;
      animation: loading 4s ease-in-out forwards;
    }

    .status-text {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.4);
      letter-spacing: 0.04em;
    }

    @keyframes loading {
      0%   { width: 0%; }
      20%  { width: 30%; }
      50%  { width: 65%; }
      80%  { width: 85%; }
      100% { width: 95%; }  /* stays at 95% until window closes */
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.6; transform: scale(1); }
      50%       { opacity: 1;   transform: scale(1.1); }
    }
  </style>
</head>
<body>
  <div class="logo-wrapper">
    <div class="logo-glow"></div>
    <img
      class="logo-img"
      src="../public/icons/mainlogo.png"
      alt="ElitPOS Logo"
      onerror="this.style.display='none'"
    />
  </div>

  <div class="app-name">ElitPOS</div>
  <div class="tagline">AI-Powered Point of Sale &amp; Business Management</div>

  <div class="progress-track">
    <div class="progress-bar" id="progress"></div>
  </div>

  <div class="status-text" id="status">Starting server...</div>

  <script>
    const statusMessages = [
      'Starting server...',
      'Loading database...',
      'Initializing modules...',
      'Almost ready...',
    ]
    let idx = 0
    const statusEl = document.getElementById('status')
    const interval = setInterval(() => {
      idx = (idx + 1) % statusMessages.length
      statusEl.textContent = statusMessages[idx]
      if (idx === statusMessages.length - 1) clearInterval(interval)
    }, 1200)
  </script>
</body>
</html>
